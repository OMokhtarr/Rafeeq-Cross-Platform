ext {
    // Capacitor 8 baseline. minSdk stays at 26 (above Capacitor 8's floor of 24) because the
    // Android Auto MediaBrowserServiceCompat path and the Media3 engine already assumed it —
    // lowering it would widen the device matrix without any tested benefit.
    minSdkVersion = 26
    // Android 16. Google Play requires API 36 for new apps and updates from 31 Aug 2026.
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.5'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
    // Media3 (native Android Auto playback engine). Was pinned to 1.3.1 under compileSdk 34;
    // compileSdk 36 lifts that constraint. Declared here so an Android Auto regression can be
    // stepped back (1.10.1, 1.9.4, …) without touching app/build.gradle.
    media3Version = '1.11.0'
}
