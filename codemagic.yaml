workflows:
  ios-release:
    name: Rafeeq iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    # Manual starts from the Codemagic UI always work; pushes only build on an ios-v* tag.
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-v*"
          include: true

    integrations:
      app_store_connect: Rafeeq ASC Key # must match the key name in Codemagic → Integrations

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rafeeq.quranquiz
      node: 22
      xcode: latest
      vars:
        CI: "false" # stops react-scripts treating warnings as errors
        PLIST: ios/App/App/Info.plist

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build:prod

      - name: Add iOS platform if missing
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Generate app icon and splash
        script: npx capacitor-assets generate --ios

      - name: Patch Info.plist (permissions, background audio, export compliance)
        script: |
          set_key() {
            /usr/libexec/PlistBuddy -c "Delete :$1" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$PLIST"
          }
          set_key NSMicrophoneUsageDescription string "Rafeeq listens while you recite so it can follow along and check your recitation."
          set_key NSLocationWhenInUseUsageDescription string "Rafeeq uses your location to calculate prayer times and the Qibla direction."
          set_key ITSAppUsesNonExemptEncryption bool false
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST"

      - name: Set version and build number
        script: |
          VERSION=$(node -p "require('./package.json').version")
          PBX=ios/App/App.xcodeproj/project.pbxproj
          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $VERSION;/g" "$PBX"
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" "$PBX"

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
